name: Test and deploy project site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python test runner
        run: python -m pip install --upgrade pip pytest
      - name: Install EVM toolchain
        run: npm install --no-audit --no-fund
      - name: Python tests (SQLite MVP + agent runtime)
        run: python -m pytest -q
      - name: Python tests (unittest entrypoint parity)
        run: python -m unittest discover -s tests
      - name: Hardhat contract and end-to-end agent tests
        run: npm test
      - name: End-to-end on-chain agent demo (offline)
        run: npm run demo:agent
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
