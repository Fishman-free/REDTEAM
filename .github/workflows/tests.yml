name: offline-tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  REDTEAM_LLM_ENABLED: "0"
  PYTHONUTF8: "1"
jobs:
  python:
    name: Python and SUTs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rsi4safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and SUT dependencies
        working-directory: .
        run: python -m pip install -r requirements-dev.txt
      - name: Payment Python suite
        working-directory: contracts
        run: python -m pytest tests -q
      - name: RSI Python and Arena suites (including promotion, resume and rollback)
        timeout-minutes: 20
        run: python -m pytest execution/tests -q --durations=15 -o faulthandler_timeout=120
      - name: PayGate suite (isolated app import)
        working-directory: rsi4safety/payment_agents/paygate
        run: python -m pytest tests -q
      - name: PayAssist suite (isolated app import)
        working-directory: rsi4safety/payment_agents/payassist
        run: python -m pytest tests -q
      - name: Multi-turn PayAssist L0/L1 offline suite (scripted model; no network calls)
        working-directory: rsi4safety/payment_agents
        run: python -m pytest tests -q
      - name: PayChain suite (isolated app import)
        working-directory: rsi4safety/payment_agents/paychain
        run: python -m pytest tests -q
      - name: Offline benchmark smoke (host-ledger evidence and strict exit status)
        run: python -m rsi4safety arena bench --campaign ci-benchmark --system A01 --seed-id A01-B01 --sut-app payassist
      - name: Offline RSI demo
        run: python -m rsi4safety demo --state-dir .rsi4safety/ci-demo --rounds 2 --json
      - name: Arena protocol demo (local SUT subprocess; no Docker or model calls)
        timeout-minutes: 10
        run: python -m rsi4safety arena run --campaign ci-drycheck --rounds 2 --dry-run
      - name: Verify Arena audit chain
        run: python -m rsi4safety arena verify --campaign ci-drycheck
  evm:
    name: Local EVM contracts and payment agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install locked EVM toolchain
        run: npm ci --no-audit --no-fund
      - name: Contract and payment-agent suites
        run: npm test
      - name: Single-turn payment demo (offline)
        run: npm run demo:agent
      - name: Multi-turn payment demo (offline)
        run: npm run demo:multiround
