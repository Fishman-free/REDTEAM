[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi4safety"
version = "0.1.0"
description = "A payment-agent safety and bounded recursive improvement research harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsi4safety = "rsi4safety.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
