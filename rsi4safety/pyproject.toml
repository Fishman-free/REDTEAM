[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi4safety"
version = "0.1.0"
description = "A payment-agent safety and bounded recursive improvement research harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
arena = ["docker>=7.0"]

[project.scripts]
rsi4safety = "rsi4safety.cli:main"

[tool.setuptools]
package-dir = {"" = "execution/src"}

[tool.setuptools.packages.find]
where = ["execution/src"]

[tool.pytest.ini_options]
testpaths = ["execution/tests", "payment_agents/tests"]
pythonpath = ["execution/src", "payment_agents"]
norecursedirs = [".*", "archieve"]
