[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam-platform"
version = "0.1.0"
description = "REDTEAM platform backend skeleton (config, custody, chain bindings)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "web3>=6.15",
    "pydantic>=2.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["redteam_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../rsi4safety/payment_agents"]
markers = [
  "e2e: live Besu testnet end-to-end test (requires --run-e2e)",
]
